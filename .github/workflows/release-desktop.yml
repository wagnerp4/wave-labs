name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux-x64
            args: ""
          - platform: windows-latest
            artifact: windows-x64
            args: ""
          - platform: macos-latest
            artifact: macos-arm64
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macos-13 runners are retired; cross-compile Intel builds on Apple Silicon.
          - platform: macos-latest
            artifact: macos-x64
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk, appindicator, rsvg)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.artifact }}

      - run: pnpm install --frozen-lockfile

      # TODO: bundle the Python engine as a per-platform sidecar before tauri-action.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "wave-labs ${{ github.ref_name }}"
          releaseBody: |
            Desktop installers for Linux (AppImage, deb, rpm), Windows (msi, exe) and macOS (dmg, Apple Silicon and Intel).

            The speech engine is not bundled yet. Install [uv](https://docs.astral.sh/uv/), clone this repository and set `WAVELABS_ENGINE_DIR` to its `engine/` folder, or run `uv run wavelabs-engine serve` there before opening the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wave-labs-${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app
          if-no-files-found: warn
          compression-level: 0
