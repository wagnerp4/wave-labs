[project]
name = "wavelabs-engine"
version = "0.1.0"
description = "Local speech engine for wave-labs: OpenAI-compatible TTS and ASR API over Hugging Face models."
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Philipp Wagner" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "soundfile>=0.12",
    "typer>=0.15",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "torchaudio>=2.4"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
whisper = ["faster-whisper>=1.1"]
all = ["wavelabs-engine[torch,kokoro,whisper]"]

[project.scripts]
wavelabs-engine = "wavelabs_engine.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavelabs_engine"]

[tool.hatch.build.targets.wheel.force-include]
"../packages/registry/adapters.json" = "wavelabs_engine/data/adapters.json"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
